<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lingua PDF Viewer</title>
  <style>
    :root {
      --toolbar-bg: #1e1e1e;
      --toolbar-border: #333;
      --toolbar-text: #e0e0e0;
      --toolbar-muted: #888;
      --toolbar-hover: #3a3a3a;
      --toolbar-active: #0078d4;
      --btn-radius: 6px;
      --transition: 120ms ease;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: #525659;
      overflow: hidden;
      height: 100vh;
      color-scheme: dark;
    }

    /* ── Toolbar ── */
    #toolbar {
      position: fixed; top: 0; left: 0; right: 0; height: 44px;
      background: var(--toolbar-bg);
      border-bottom: 1px solid var(--toolbar-border);
      display: flex; align-items: center;
      padding: 0 12px; gap: 2px;
      z-index: 1000;
      user-select: none;
    }

    .logo {
      width: 26px; height: 26px; border-radius: 6px;
      background: linear-gradient(135deg, #0078d4, #00b4d8);
      color: #fff; font-weight: 700; font-size: 13px;
      display: flex; align-items: center; justify-content: center;
      margin-right: 10px; flex-shrink: 0;
    }
    .title {
      color: var(--toolbar-text); font-size: 13px; font-weight: 500;
      flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      margin-right: 12px;
    }

    .sep {
      width: 1px; height: 22px;
      background: var(--toolbar-border);
      margin: 0 6px; flex-shrink: 0;
    }

    .tb {
      background: transparent; color: var(--toolbar-text);
      border: none; border-radius: var(--btn-radius);
      padding: 0; width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background var(--transition), color var(--transition);
      font-size: 15px; flex-shrink: 0;
    }
    .tb:hover { background: var(--toolbar-hover); }
    .tb:active { background: #505050; transform: scale(0.96); }
    .tb:disabled { opacity: 0.35; cursor: default; pointer-events: none; }
    .tb.active { background: var(--toolbar-active); color: #fff; }
    .tb svg { width: 16px; height: 16px; fill: currentColor; }
    .tb-wide { width: auto; padding: 0 10px; gap: 5px; font-size: 12px; font-weight: 500; }

    .ti {
      background: #2d2d2d; color: var(--toolbar-text);
      border: 1px solid #444; border-radius: var(--btn-radius);
      padding: 0 6px; height: 28px; font-size: 12px;
      text-align: center; outline: none;
      transition: border-color var(--transition);
    }
    .ti:focus { border-color: var(--toolbar-active); }
    #page-input { width: 44px; -moz-appearance: textfield; }
    #page-input::-webkit-outer-spin-button,
    #page-input::-webkit-inner-spin-button { -webkit-appearance: none; }

    .tl { color: var(--toolbar-muted); font-size: 12px; flex-shrink: 0; white-space: nowrap; }

    .btn-translate {
      background: var(--toolbar-active); color: #fff;
      border: none; border-radius: var(--btn-radius);
      padding: 0 12px; height: 30px;
      display: flex; align-items: center; justify-content: center; gap: 5px;
      cursor: pointer; font-size: 12px; font-weight: 500;
      transition: background var(--transition), transform var(--transition);
      white-space: nowrap; flex-shrink: 0;
    }
    .btn-translate:hover { background: #1a8ae6; }
    .btn-translate:active { transform: scale(0.97); }
    .btn-translate:disabled { opacity: 0.4; cursor: default; pointer-events: none; }
    .btn-translate svg { width: 14px; height: 14px; fill: currentColor; }

    /* ── Search Panel ── */
    #search-panel {
      position: fixed; top: 44px; right: 12px;
      background: var(--toolbar-bg); border: 1px solid var(--toolbar-border);
      border-radius: 8px; padding: 8px 10px;
      display: flex; align-items: center; gap: 6px;
      z-index: 1001; box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      transition: opacity 0.15s ease, transform 0.15s ease;
    }
    #search-panel.hidden { display: none; }
    #search-input {
      background: #2d2d2d; color: var(--toolbar-text);
      border: 1px solid #444; border-radius: var(--btn-radius);
      padding: 0 8px; height: 28px; font-size: 12px; width: 200px; outline: none;
    }
    #search-input:focus { border-color: var(--toolbar-active); }
    #search-info { color: var(--toolbar-muted); font-size: 11px; min-width: 50px; text-align: center; }

    /* ── Split View ── */
    #split-container {
      position: fixed; top: 44px; left: 0; right: 0; bottom: 0;
      display: flex; overflow: hidden;
    }

    /* Left: PDF */
    #pdf-panel {
      flex: 1 1 0%; overflow: auto; background: #525659;
      min-width: 0;
    }
    #pdf-pages {
      display: flex; flex-direction: column; align-items: center;
      padding: 20px 0; gap: 12px; min-height: 100%;
    }

    /* Divider */
    #divider {
      width: 5px; flex-shrink: 0; cursor: col-resize;
      background: #2a2a2a; position: relative; z-index: 10;
      transition: background 0.15s ease;
    }
    #divider:hover, #divider.dragging {
      background: var(--toolbar-active);
    }
    #divider::after {
      content: ''; position: absolute;
      top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 3px; height: 32px; border-radius: 2px;
      background: rgba(255,255,255,0.15);
      transition: background 0.15s ease, height 0.15s ease;
    }
    #divider:hover::after, #divider.dragging::after {
      background: rgba(255,255,255,0.5); height: 48px;
    }

    /* Right: Translation */
    #translation-panel {
      flex: 0 0 0px; overflow: hidden; background: #1c1c28;
      min-width: 0;
    }
    #translation-pages {
      padding: 20px 12px; min-height: 100%;
    }

    /* Page container */
    .page-container {
      position: relative; background: white;
      box-shadow: 0 1px 6px rgba(0,0,0,0.35), 0 0 1px rgba(0,0,0,0.2);
      flex-shrink: 0;
      border-radius: 2px;
      overflow: hidden;
    }
    .page-container canvas { display: block; border-radius: 2px; }

    /* Text layer */
    .text-layer {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      overflow: hidden; opacity: 0.3; line-height: 1.0;
    }
    .text-layer > span {
      color: transparent; position: absolute; white-space: pre;
      transform-origin: 0% 0%;
    }

    /* ── Translation Page ── */
    .tp-page {
      position: relative;
      margin-bottom: 0;
    }
    .tp-page-label {
      color: #999; font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.5px;
      margin-bottom: 16px; padding-bottom: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .tp-segment {
      position: absolute;
      left: 8px; right: 8px;
      cursor: pointer;
      border-radius: 4px;
      transition: background 0.15s ease;
    }
    .tp-segment:hover {
      background: rgba(255,255,255,0.03);
    }
    .tp-segment.segment-active {
      background: rgba(0, 120, 212, 0.08);
      box-shadow: inset 3px 0 0 var(--toolbar-active);
    }

    .tp-fa {
      direction: rtl;
      text-align: right;
      font-family: 'Vazirmatn', 'Tahoma', 'Arial', sans-serif;
      font-size: 14px;
      line-height: 1.85;
      color: #e8e8e8;
      padding: 6px 10px;
      word-wrap: break-word;
      overflow-wrap: break-word;
      white-space: pre-wrap;
    }

    /* Source highlight overlay */
    .src-highlight {
      position: absolute;
      background: rgba(0, 120, 212, 0.15);
      border: 1px solid rgba(0, 120, 212, 0.4);
      border-radius: 2px;
      pointer-events: none;
      z-index: 5;
      transition: opacity 0.3s ease;
    }

    /* ── Status indicator in translation panel ── */
    .tp-status {
      color: var(--toolbar-muted); font-size: 12px;
      text-align: center; padding: 40px 20px; line-height: 1.6;
    }
    .tp-status .spinner-small {
      width: 20px; height: 20px; margin: 0 auto 12px;
      border: 2px solid rgba(255,255,255,0.1);
      border-top-color: var(--toolbar-active);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .tp-status-line {
      font-size: 12px;
      padding: 6px 10px;
      margin: 4px 8px;
      border-radius: 4px;
      direction: ltr;
      text-align: left;
    }
    .tp-status-retrying {
      color: #e0a000;
      background: rgba(224, 160, 0, 0.08);
      border-left: 2px solid #e0a000;
    }
    .tp-status-error {
      color: #e05555;
      background: rgba(224, 85, 85, 0.08);
      border-left: 2px solid #e05555;
    }

    /* Loading */
    #loading {
      position: fixed; top: 44px; left: 0; right: 0; bottom: 0;
      display: flex; align-items: center; justify-content: center;
      background: #525659; z-index: 500;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #0078d4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #error {
      position: fixed; top: 44px; left: 0; right: 0; bottom: 0;
      display: none; align-items: center; justify-content: center;
      background: #525659; z-index: 500;
    }
    .err-card {
      background: #1e1e1e; padding: 32px; border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4); text-align: center; max-width: 360px;
    }
    .err-card h2 { color: #f44; font-size: 16px; margin-bottom: 8px; font-weight: 600; }
    .err-card p { color: #999; font-size: 13px; line-height: 1.5; }

    @media print {
      #toolbar, #search-panel { display: none !important; }
      #split-container { top: 0 !important; }
      #translation-panel { display: none !important; }
      #divider { display: none !important; }
      #pdf-panel { flex: 1 1 0% !important; }
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      #toolbar { padding: 0 6px; gap: 1px; }
      .tb { width: 28px; height: 28px; }
      .tb-wide { padding: 0 6px; font-size: 11px; }
      .ti { height: 26px; font-size: 11px; }
      .btn-translate { padding: 0 8px; height: 28px; font-size: 11px; }
      .title { font-size: 11px; }
      #search-input { width: 140px; }

      #split-container {
        flex-direction: column;
      }
      #pdf-panel, #translation-panel {
        flex: 1 1 50% !important;
        width: 100% !important;
      }
      #divider {
        width: 100% !important;
        height: 5px;
        cursor: row-resize;
      }
      #divider::after {
        width: 32px !important;
        height: 3px !important;
      }
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <div class="logo">L</div>
    <span class="title" id="doc-title">Loading PDF...</span>

    <div class="sep"></div>

    <button class="tb" id="prev-page" title="Previous Page">
      <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
    </button>
    <input class="ti" id="page-input" type="number" min="1" value="1">
    <span class="tl" id="total-pages">/ -</span>
    <button class="tb" id="next-page" title="Next Page">
      <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
    </button>

    <div class="sep"></div>

    <button class="tb" id="zoom-out" title="Zoom Out">
      <svg viewBox="0 0 24 24"><path d="M19 13H5v-2h14v2z"/></svg>
    </button>
    <span class="tl" id="zoom-level" style="min-width:40px; text-align:center;">150%</span>
    <button class="tb" id="zoom-in" title="Zoom In">
      <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
    </button>

    <div class="sep"></div>

    <button class="tb tb-wide" id="fit-width" title="Fit Width">
      <svg viewBox="0 0 24 24" style="width:14px;height:14px;"><path d="M1 3h22v2H1V3zm0 8h8v2H1v-2zm0 8h22v2H1v-2zm12-8h8v2h-8v-2zm0 8h8v2h-8v-2zM1 13h22v2H1v-2zm0-8h8v2H1V5zm0 16h22v2H1v-2z"/></svg>
      Width
    </button>
    <button class="tb tb-wide" id="fit-page" title="Fit Page">
      <svg viewBox="0 0 24 24" style="width:14px;height:14px;"><path d="M3 5v14h18V5H3zm4 2v10h14V7H7z"/></svg>
      Page
    </button>

    <div class="sep"></div>

    <button class="tb" id="search-toggle" title="Search (Ctrl+F)">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    </button>
    <button class="tb" id="download" title="Download">
      <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
    </button>
    <button class="tb" id="print" title="Print (Ctrl+P)">
      <svg viewBox="0 0 24 24"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg>
    </button>
    <button class="tb" id="fullscreen" title="Fullscreen">
      <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
    </button>

    <div class="sep"></div>

    <button class="btn-translate" id="translate-btn" title="Translate Current Page">
      <svg viewBox="0 0 24 24"><path d="M12.87 15.07l-2.54-2.51.03-.03A17.52 17.52 0 0014.07 6H17V4h-7V2H8v2H1v2h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z"/></svg>
      Translate Page
    </button>

    <span class="tl" id="status" style="margin-left: auto;">Loading...</span>
  </div>

  <div id="search-panel" class="hidden">
    <input class="ti" id="search-input" type="text" placeholder="Search in PDF...">
    <button class="tb" id="search-prev" title="Previous Result">
      <svg viewBox="0 0 24 24" style="width:14px;height:14px;"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
    </button>
    <button class="tb" id="search-next" title="Next Result">
      <svg viewBox="0 0 24 24" style="width:14px;height:14px;"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
    </button>
    <span id="search-info"></span>
    <button class="tb" id="close-search" title="Close">
      <svg viewBox="0 0 24 24" style="width:14px;height:14px;"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
  </div>

  <div id="loading"><div class="spinner"></div></div>
  <div id="error"><div class="err-card"><h2>Error Loading PDF</h2><p id="error-text">Could not load the PDF file.</p></div></div>

  <div id="split-container">
    <div id="pdf-panel"><div id="pdf-pages"></div></div>
    <div id="divider"></div>
    <div id="translation-panel">
      <div id="translation-pages"></div>
    </div>
  </div>

  <script type="module" src="./viewer.ts"></script>
</body>
</html>
